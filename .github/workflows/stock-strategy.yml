name: 股票策略定时执行

on:
  schedule:
    # GitHub 实际运行比配置晚约1小时
    # 配置 12:00 UTC = 北京时间 20:00，实际运行约 21:00
    # 周一到周五每天执行
    - cron: '0 12 * * 1-5'
    # 周日下午6点执行（北京时间18:00 = UTC 10:00）
    - cron: '0 10 * * 0'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 强制所有 JavaScript actions 使用 Node.js 24，避免 Node.js 20 废弃警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        # 验证 pyarrow 安装
        python -c "import pyarrow; print(f'pyarrow version: {pyarrow.__version__}')"
    
    - name: 获取当前日期
      id: date
      run: |
        echo "today=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo " Trading date: $(date +'%Y-%m-%d %H:%M:%S')"
    
    - name: 运行全部股票策略
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        DB_PATH: ${{ github.workspace }}/stock_strategy.db
        CACHE_DIR: ${{ github.workspace }}/data_cache
      run: |
        echo "========================================"
        echo "开始执行统一策略管道 (main_par2 + main_par5)"
        echo "日期: ${{ steps.date.outputs.today }}"
        echo "========================================"
        python run_all_strategies.py --date ${{ steps.date.outputs.today }} --backtest --hold-days 3

    - name: 运行ETF定投回测
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: |
        echo "========================================"
        echo "开始执行ETF定投策略回测"
        echo "日期: ${{ steps.date.outputs.today }}"
        echo "========================================"
        python weekly_dca_strategy.py --target config --amount 1000 --years 5

    - name: 生成报告索引
      run: python generate_reports_json.py

    - name: 生成多指标趋势汇总
      run: python generate_multi_indicator_trend_html.py
      continue-on-error: true

    - name: 生成邮件报告
      run: |
        python generate_email_report.py \
          --status "${{ job.status }}" \
          --repo "${{ github.repository }}" \
          --ref "${{ github.ref }}" \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      if: always()

    - name: 上传邮件报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: email-report-${{ steps.date.outputs.today }}
        path: email_report.html
        retention-days: 7

    - name: 提交生成的文件到仓库
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add html/ reports.json index.html strategy_state.json c154_result_*.csv etf_config.json
        git add c432_result_*.csv 2>/dev/null || true
        git add macd_result_*.csv 2>/dev/null || true
        git add html/multi_indicator_trend/ 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Auto-commit: Update reports for ${{ steps.date.outputs.today }}"
        git pull --rebase https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }} 2>/dev/null || true
        git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
    
    - name: 上传结果文件
      uses: actions/upload-artifact@v4
      if: always()  # 即使失败也上传
      with:
        name: strategy-results-${{ steps.date.outputs.today }}
        path: |
          result.csv
          *.csv
          *.html
          *.json
          stock_strategy.db
        retention-days: 30  # 保留30天

  # 邮件通知
  notify:
    needs: run-strategy
    runs-on: ubuntu-latest
    if: always()  # 无论成功失败都通知

    steps:
    - name: 下载邮件报告
      uses: actions/download-artifact@v4
      with:
        name: email-report-${{ needs.run-strategy.outputs.today || 'placeholder' }}
      continue-on-error: true

    - name: 发送邮件通知
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.qq.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        secure: true
        subject: "📊 股票策略执行完成 - ${{ needs.run-strategy.result }}"
        to: ${{ secrets.EMAIL_RECIPIENTS }}
        from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
        html_body: file://email_report.html
