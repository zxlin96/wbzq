<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J13 每日数量趋势 - 20251112</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 标题 -->
        <div class="glass p-6 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">📈 J13 每日数量趋势</h1>
                    <p class="text-gray-500 mt-1">日期: 20251112 | KDJ J值小于13的股票数量</p>
                </div>
                <div class="flex gap-3">
                    <a href="../../index.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        ← 返回首页
                    </a>
                    <a href="stock_selection_20251112.html" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                        查看选股 →
                    </a>
                </div>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="glass p-4 stat-card">
                <div class="text-sm text-gray-500">平均数量</div>
                <div class="text-2xl font-bold text-blue-600">1072.3 只</div>
            </div>
            <div class="glass p-4 stat-card">
                <div class="text-sm text-gray-500">最高数量</div>
                <div class="text-2xl font-bold text-green-600">3256 只</div>
                <div class="text-xs text-gray-400">2025-09-04 00:00:00</div>
            </div>
            <div class="glass p-4 stat-card">
                <div class="text-sm text-gray-500">最低数量</div>
                <div class="text-2xl font-bold text-orange-600">340 只</div>
            </div>
            <div class="glass p-4 stat-card">
                <div class="text-sm text-gray-500">数据天数</div>
                <div class="text-2xl font-bold text-purple-600">60 天</div>
            </div>
            <div class="glass p-4 stat-card">
                <div class="text-sm text-gray-500">90%分位数</div>
                <div class="text-2xl font-bold text-red-600">1891.4 只</div>
            </div>
        </div>
        
        <!-- 图表 -->
        <div class="glass p-6">
            <div id="chart" style="width: 100%; height: 500px;"></div>
        </div>
        
        <!-- 说明 -->
        <div class="glass p-6 mt-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">ℹ️ 说明</h2>
            <div class="text-gray-600 space-y-2">
                <p>• <b>J13</b>：KDJ指标的J值小于13，表示股票处于超卖状态</p>
                <p>• <b>红色标记点</b>：数量超过平均值50%的交易日，可能存在批量买入机会</p>
                <p>• 数据每日自动更新，基于当日收盘后的KDJ指标计算</p>
            </div>
        </div>
    </div>
    
    <script>
        const chart = echarts.init(document.getElementById('chart'));
        
        const option = {
            title: {
                text: 'J13 每日出现总数趋势',
                subtext: 'KDJ J值 < 13 的股票数量',
                left: 'center',
                textStyle: { fontSize: 18, fontWeight: 'bold' }
            },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(255,255,255,0.95)',
                borderColor: '#ccc',
                borderWidth: 1,
                formatter: function(params) {
                    const date = params[0].axisValue;
                    const count = params[0].value;
                    return `<b>${date}</b><br/>J13数量: <b>${count}</b> 只`;
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '15%',
                top: '20%',
                containLabel: true
            },
            toolbox: {
                feature: {
                    saveAsImage: { title: '保存图片' },
                    dataZoom: { title: { zoom: '区域缩放', back: '还原' } },
                    restore: { title: '还原' }
                }
            },
            dataZoom: [
                { type: 'inside', start: 0, end: 100 },
                { type: 'slider', start: 0, end: 100, bottom: 10 }
            ],
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ["2025-08-13", "2025-08-14", "2025-08-15", "2025-08-18", "2025-08-19", "2025-08-20", "2025-08-21", "2025-08-22", "2025-08-25", "2025-08-26", "2025-08-27", "2025-08-28", "2025-08-29", "2025-09-01", "2025-09-02", "2025-09-03", "2025-09-04", "2025-09-05", "2025-09-08", "2025-09-09", "2025-09-10", "2025-09-11", "2025-09-12", "2025-09-15", "2025-09-16", "2025-09-17", "2025-09-18", "2025-09-19", "2025-09-22", "2025-09-23", "2025-09-24", "2025-09-25", "2025-09-26", "2025-09-29", "2025-09-30", "2025-10-09", "2025-10-10", "2025-10-13", "2025-10-14", "2025-10-15", "2025-10-16", "2025-10-17", "2025-10-20", "2025-10-21", "2025-10-22", "2025-10-23", "2025-10-24", "2025-10-27", "2025-10-28", "2025-10-29", "2025-10-30", "2025-10-31", "2025-11-03", "2025-11-04", "2025-11-05", "2025-11-06", "2025-11-07", "2025-11-10", "2025-11-11", "2025-11-12"],
                axisLabel: { rotate: 45 }
            },
            yAxis: {
                type: 'value',
                name: '数量（只）',
                min: 0
            },
            series: [{
                name: 'J13数量',
                type: 'line',
                data: [398, 843, 919, 659, 502, 340, 348, 405, 345, 382, 987, 867, 1238, 1274, 1854, 3010, 3256, 2110, 932, 992, 1000, 410, 358, 462, 398, 472, 987, 1631, 2285, 2223, 1231, 1454, 1751, 1475, 1304, 1008, 974, 588, 918, 777, 1017, 1878, 2012, 1281, 1143, 898, 635, 471, 592, 574, 1002, 935, 769, 1051, 1036, 861, 1136, 1102, 1205, 1375],
                smooth: true,
                symbol: 'circle',
                symbolSize: 8,
                lineStyle: { width: 3, color: '#5470c6' },
                itemStyle: { color: '#5470c6' },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(84, 112, 198, 0.3)' },
                        { offset: 1, color: 'rgba(84, 112, 198, 0.05)' }
                    ])
                },
                markLine: {
                    data: [
                        {
                            type: 'average',
                            name: '平均值',
                            lineStyle: { color: '#91cc75', type: 'dashed', width: 2 }
                        },
                        {
                            yAxis: 1891.4,
                            name: '90%分位',
                            lineStyle: { color: '#ee6666', type: 'dashed', width: 2 }
                        }
                    ],
                    label: {
                        formatter: function(params) {
                            if (params.name === '90%分位') return '90%分位: ' + params.value + ' 只';
                            return '平均: ' + params.value + ' 只';
                        },
                        position: 'end'
                    }
                },
                markPoint: {
                    data: [
                        { type: 'max', name: '最大值', itemStyle: { color: '#ee6666' } },
                        { type: 'min', name: '最小值', itemStyle: { color: '#73c0de' } }
                    ]
                }
            }]
        };
        
        chart.setOption(option);
        
        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
