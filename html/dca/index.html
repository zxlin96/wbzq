<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF定投策略汇总</title>
    <link rel="stylesheet" href="../../assets/tailwind.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .etf-card {
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .etf-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.15);
        }
        .action-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .action-badge-sm {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }
        .metric-pill {
            display: inline-block;
            padding: 4px 10px;
            background: #f3f4f6;
            border-radius: 6px;
            font-size: 12px;
            color: #4b5563;
            margin: 2px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 16px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #4338ca; }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .pos-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: 6px;
            background: #f9fafb;
        }
        .pos-row .pos-meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }
    </style>
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/site.js" defer></script>
</head>
<body data-static-version="3" class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <a href="../../index.html" class="back-btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">ETF 定投策略汇总</h1>
            <p class="text-gray-500">周线KDJ定投 · 知行多空线 · 自动更新</p>
            <p class="text-sm text-gray-400 mt-1">最后更新: <span id="lastUpdate">加载中...</span></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="etfGrid">
            <div class="skeleton h-64"></div>
            <div class="skeleton h-64"></div>
            <div class="skeleton h-64"></div>
        </div>

        <div class="text-center mt-10 text-gray-400 text-sm">
            <p>数据由 Tushare 提供 | 周线KDJ定投策略 | GitHub Actions 自动更新</p>
        </div>
    </div>

    <script src="../../assets/dca.js" defer></script>
</body>
</html>
