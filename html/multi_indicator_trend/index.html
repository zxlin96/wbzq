<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多指标选股趋势汇总</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: Inter, sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <a href="../../index.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 mb-6">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            返回首页
        </a>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">📊 多指标选股趋势汇总</h1>
            <p class="text-gray-600">超阈值行业历史趋势 · 持续强势识别 · 行业轮动信号</p>
            <p class="text-sm text-gray-500 mt-1">最后更新: 20260819</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-2xl font-bold text-blue-600">2</div>
                <div class="text-xs text-gray-500 mt-1">历史交易日数</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-2xl font-bold text-teal-600">0</div>
                <div class="text-xs text-gray-500 mt-1">行业总数</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-2xl font-bold text-orange-600">0</div>
                <div class="text-xs text-gray-500 mt-1">最新超阈值数</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4 text-center">
                <div class="text-2xl font-bold text-purple-600">0</div>
                <div class="text-xs text-gray-500 mt-1">最长连续天数</div>
            </div>
        </div>

        
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6 text-center text-gray-500">
            暂无超阈值行业数据
        </div>

        

        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">🟢 新进入 / ⚪ 退出行业</h2>
            <div class="mb-3">
                <span class="text-sm font-medium text-gray-700 mr-2">新进入:</span>
                <span class="text-gray-400 text-sm">无</span>
            </div>
            <div>
                <span class="text-sm font-medium text-gray-700 mr-2">退出:</span>
                <span class="text-gray-400 text-sm">无</span>
            </div>
        </div>

        <div class="text-center mt-8 text-gray-500 text-sm">
            <p>多指标联合选股趋势汇总 · 自动生成</p>
        </div>
    </div>

    <script>
    const chartOptions = {"line": {"tooltip": {"trigger": "axis"}, "grid": {"left": "8%", "right": "5%", "top": "10%", "bottom": "15%"}, "xAxis": {"type": "category", "data": ["2025-06-20", "2026-08-19"], "axisLabel": {"rotate": 45}}, "yAxis": {"type": "value", "name": "入选总数"}, "series": [{"name": "超阈值行业总数", "type": "line", "data": [0, 0], "smooth": true, "areaStyle": {"opacity": 0.3}}]}, "bar": {"tooltip": {"trigger": "axis", "axisPointer": {"type": "shadow"}}, "legend": {"data": [], "top": "5%", "type": "scroll"}, "grid": {"left": "8%", "right": "5%", "top": "20%", "bottom": "15%"}, "xAxis": {"type": "category", "data": ["2025-06-20", "2026-08-19"], "axisLabel": {"rotate": 45}}, "yAxis": {"type": "value", "name": "入选数量"}, "series": []}, "heatmap": {"tooltip": {"position": "top"}, "grid": {"left": "15%", "right": "5%", "top": "10%", "bottom": "20%"}, "xAxis": {"type": "category", "data": ["2025-06-20", "2026-08-19"], "axisLabel": {"rotate": 45}}, "yAxis": {"type": "category", "data": []}, "visualMap": {"min": 0, "max": 1, "calculable": true, "orient": "horizontal", "left": "center", "bottom": "5%"}, "series": [{"name": "入选数量", "type": "heatmap", "data": [], "label": {"show": false}}]}};
    if (chartOptions.line && chartOptions.line.series && chartOptions.line.series.length > 0) {
        const cl = echarts.init(document.getElementById('chartLine'));
        cl.setOption(chartOptions.line);
        const cb = echarts.init(document.getElementById('chartBar'));
        cb.setOption(chartOptions.bar);
        const ch = echarts.init(document.getElementById('chartHeatmap'));
        ch.setOption(chartOptions.heatmap);
        window.addEventListener('resize', () => { cl.resize(); cb.resize(); ch.resize(); });
    }
    </script>
</body>
</html>
